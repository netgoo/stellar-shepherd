<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404: Page Not Found | Wenboom</title>
    <meta name="robots" content="noindex, follow" />
    <link rel="stylesheet" href="/site-common.css">
    <style>
        .not-found-container {
            min-height: 60vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 3rem 1rem;
        }
        .error-code {
            font-size: 5rem;
            font-weight: 800;
            color: var(--accent-gold);
            line-height: 1;
            margin-bottom: 0.5rem;
        }
        .error-title {
            font-size: 1.6rem;
            color: #fff;
            margin-bottom: 0.75rem;
        }
        .error-desc {
            color: var(--text-muted);
            max-width: 480px;
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        .error-links {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            justify-content: center;
            margin-bottom: 2rem;
        }
        .error-link {
            color: var(--accent-gold);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            padding: 0.5rem 1rem;
            border: 1px solid rgba(243, 198, 83, 0.3);
            border-radius: 6px;
            transition: 0.2s;
        }
        .error-link:hover {
            background: rgba(243, 198, 83, 0.1);
            border-color: var(--accent-gold);
        }
        .back-btn {
            background-color: var(--accent-gold);
            color: #000;
            font-weight: 700;
            padding: 0.75rem 2rem;
            border-radius: 6px;
            text-decoration: none;
            transition: 0.2s;
        }
        .back-btn:hover {
            background-color: #e0b342;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
<!-- HEADER -->
    <main class="not-found-container">
        <div class="error-code">404</div>
        <h1 class="error-title">Autonomous Route Lost</h1>
        <p class="error-desc">The blueprint or page you are looking for has been moved, renamed, or no longer exists in our system matrix. Try one of the destinations below:</p>
        <div class="error-links">
            <a href="/" class="error-link">Home</a>
            <a href="/trends" class="error-link">Blueprints & Reports</a>
            <a href="/tools" class="error-link">7-Core Stack</a>
            <a href="/blueprints" class="error-link">Master Blueprints</a>
        </div>
        <a href="/" class="back-btn">&larr; Back to Home</a>
    </main>
<!-- FOOTER -->
</body>
</html>
