name: Verify Data Integrity

on:
  push:
    branches: [main]
    paths:
      - 'src/data/articles.ts'
  pull_request:
    paths:
      - 'src/data/articles.ts'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Verify articles.ts data integrity
        run: npx tsx scripts/verify-data.ts
